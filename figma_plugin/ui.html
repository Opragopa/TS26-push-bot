<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 12px Inter, sans-serif; margin: 16px; color: var(--figma-color-text); }
    h2 { margin: 0 0 12px; font-size: 16px; }
    label { display: block; margin: 12px 0 5px; font-weight: 600; }
    input, textarea { box-sizing: border-box; width: 100%; border: 1px solid var(--figma-color-border); border-radius: 6px; padding: 8px; color: inherit; background: var(--figma-color-bg); }
    textarea { min-height: 100px; resize: vertical; }
    button { margin-top: 12px; border: 0; border-radius: 6px; padding: 9px 12px; background: #18a0fb; color: white; cursor: pointer; }
    button.secondary { background: var(--figma-color-bg-secondary); color: inherit; }
    #status { margin-top: 12px; white-space: pre-wrap; line-height: 1.4; }
    .hint { color: var(--figma-color-text-secondary); line-height: 1.4; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .actions button { flex: 1; }
  </style>
</head>
<body>
  <h2>TS26: визитки из AE-ready</h2>
  <div class="hint">Откройте файл с шаблоном визитки. Плагин прочитает лист content_plan_cards, покажет проверку и создаст или обновит карточки.</div>
  <label>Ссылка на лист content_plan_cards</label>
  <input id="url" placeholder="Можно обычную ссылку Google Sheets или export?format=tsv">
  <label>Имя шаблона</label>
  <input id="template" value="TS26/VIZITKA_TEMPLATE">
  <label>Зазор между карточками, px</label>
  <input id="gap" type="number" value="80">
  <label>Или вставьте TSV для теста</label>
  <textarea id="tsv" placeholder="person_id\tФИО спикера\tДолжность\tФото на плашку..."></textarea>
  <div class="actions">
    <button id="preview">Проверить актуальные данные</button>
    <button id="generate" class="secondary" disabled>Создать / обновить</button>
  </div>
  <div id="status"></div>
  <script>
    let rows = [];
    let lastSourceHash = '';
    const $ = id => document.getElementById(id);
    const status = text => { $('status').textContent = text; };
    const warnings = row => {
      const result = [];
      if (!row['ФИО спикера'] || row['ФИО спикера'].trim().split(/\s+/).length < 2) result.push('проверьте ФИО');
      if (!row['Должность'] || !row['Должность'].trim()) result.push('нет должности');
      if (/\d+\)|^\d+\./.test(row['ФИО спикера'] || '') || /\d+\)|^\d+\./.test(row['Должность'] || '')) result.push('осталась нумерация');
      if ((row['Должность'] || '').length > 180) result.push('должность длиннее 180 символов');
      return result;
    };
    $('preview').onclick = async () => {
      $('generate').disabled = true;
      status('Проверяю данные...');
      parent.postMessage({ pluginMessage: { type: 'preview', url: $('url').value.trim(), tsv: $('tsv').value.trim() } }, '*');
    };
    $('generate').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'generate', rows, settings: { templateName: $('template').value.trim(), gap: $('gap').value } } }, '*');
      status('Генерация выполняется...');
    };
    onmessage = event => {
      const message = event.data.pluginMessage;
      if (!message) return;
      if (message.type === 'error') status(`Ошибка Figma: ${message.message}`);
      if (message.type === 'preview-done') {
        const previousHash = lastSourceHash;
        lastSourceHash = message.result.sourceHash || '';
        rows = message.result.rows.map(item => item.row);
        const changeLine = previousHash && previousHash === lastSourceHash ? 'Изменений с прошлой проверки нет.' : previousHash ? 'Данные изменились с прошлой проверки.' : 'Данные загружены.';
        const sourceLine = message.result.sourceUrl ? `Источник: ${message.result.sourceUrl}\n` : '';
        const lines = message.result.rows.map(item => `${item.index}. ${item.row['ФИО спикера'] || 'без ФИО'} — ${item.row['Должность'] || 'без должности'}${item.warnings.length ? ` [${item.warnings.join(', ')}]` : ''}`);
        status(`${changeLine}\n${sourceLine}Найдено визиток: ${rows.length}\n\n${lines.join('\n')}\n\nПроверьте список и нажмите «Создать / обновить».`);
        $('generate').disabled = false;
      }
      if (message.type === 'done') {
        const created = message.result.filter(item => item.created).length;
        const updated = message.result.length - created;
        const problems = message.result.filter(item => item.warnings.length || !item.photo).map(item => `${item.name}: ${[...item.warnings, item.photo ? '' : 'фото не загружено'].filter(Boolean).join(', ')}`);
        const imageWarnings = message.imageWarnings || [];
        status(`Готово. Создано: ${created}, обновлено: ${updated}.${problems.length ? `\n\nПроверить вручную:\n${problems.join('\n')}` : ''}`);
        if (imageWarnings.length) status(`${$('status').textContent}\n\nОшибки загрузки фото:\n${imageWarnings.join('\n')}`);
      }
    };
  </script>
</body>
</html>
